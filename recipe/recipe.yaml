schema_version: 1

context:
  name: cattrs
  version: "26.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cattrs-${{ version }}.tar.gz
  sha256: 3cf49f69df8326bcf17a3cb3d3d3ec4a856858fe3a7473746c9044c317d3ba55

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - attrs >=25.4.0
    - typing_extensions >=4.14.0

tests:
  - python:
      imports:
        - cattr
        - cattr.preconf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Composable complex class support for attrs and dataclasses.
  license: MIT
  license_file: LICENSE
  description: |
    cattrs is an open source Python library for structuring and unstructuring data.
    cattrs works best with attrs classes and the usual Python collections, but other
    kinds of classes are supported by manually registering converters.

    PyPI: [https://pypi.org/project/cattrs](https://pypi.org/project/cattrs)

  homepage: https://github.com/python-attrs/cattrs
  repository: https://github.com/python-attrs/cattrs
  documentation: https://cattrs.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - aldanor
    - Tinche
    - xylar
    - sugatoray
